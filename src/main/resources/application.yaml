spring:
  webflux:
    apiversion:
      use:
        path-segment: 1
      default: v1
  application:
    name: fit-tracker-middleware
  r2dbc:
    url: r2dbc:${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    url: jdbc:${DATASOURCE_URL}
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/${spring.profiles.active}
  data:
    redis:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

fit-tracker:
  baseUrl: ${FIT_TRACKER_BASE_URL}
  clientId: ${FIT_TRACKER_CLIENT_ID}
  clientSecret: ${FIT_TRACKER_CLIENT_SECRET}
  version: ${FIT_TRACKER_API_VERSION}