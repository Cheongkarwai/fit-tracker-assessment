spring:
  webflux:
    apiversion:
      use:
        path-segment: 1
      default: v1
  application:
    name: fit-tracker-middleware
  r2dbc:
    url: r2dbc:${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    url: jdbc:${DATASOURCE_URL}
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/${spring.profiles.active}
  data:
    redis:
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

fit-tracker:
  baseUrl: ${FIT_TRACKER_BASE_URL}
  clientId: ${FIT_TRACKER_CLIENT_ID}
  clientSecret: ${FIT_TRACKER_CLIENT_SECRET}
  version: ${FIT_TRACKER_API_VERSION}


resilience4j:
  retry:
    instances:
      cache-client:
        max-attempts: 10
        wait-duration: 3s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 120s
        retry-exceptions:
          - org.springframework.data.redis.RedisSystemException
          - org.redisson.client.RedisException
      fit-tracker-client:
        max-attempts: 10
        wait-duration: 3s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 120s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.handler.timeout.ReadTimeoutException
  bulkhead:
    instances:
      fit-tracker-client:
        max-concurrent-calls: 10
        max-wait-duration: 30s
  circuitbreaker:
    instances:
      cache-client:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        sliding-window-type: COUNT-BASED
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - org.springframework.data.redis.RedisSystemException
          - org.redisson.client.RedisException
      fit-tracker-client:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        sliding-window-type: COUNT-BASED
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        record-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - io.netty.handler.timeout.ReadTimeoutException
